<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGM | Gestione prenotazioni</title><style>body{background:#101010;color:#f7f7f7;font:16px system-ui;margin:0}header{background:#f4d11b;color:#111;padding:22px;text-align:center}main{max-width:920px;margin:auto;padding:18px}section{background:#222;border-radius:12px;padding:18px;margin:15px 0}input,select,button{font:inherit;padding:11px;border-radius:7px;margin:5px 0;box-sizing:border-box}input,select{background:#333;color:#fff;border:1px solid #777;max-width:100%}button{background:#f4d11b;color:#111;border:0;cursor:pointer;font-weight:650}button:disabled{opacity:.5}label{display:block;margin:10px 0}small{color:#ccc}.item{border-top:1px solid #555;padding:14px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{font-size:14px}.muted{color:#aaa}.error{color:#ffb1b1}a{color:#f4d11b}.hide{display:none!important}</style></head><body><header><h1>SGM | Pannello prenotazioni</h1><div>Accesso riservato agli amministratori</div></header><main><section id="login"><h2>Accedi</h2><form id="loginForm"><label>Email<br><input type="email" id="email" required autocomplete="username"></label><label>Password<br><input type="password" id="password" required autocomplete="current-password"></label><button>Accedi</button></form><p id="loginMsg"></p><small>Usa un account amministratore SGM già autorizzato.</small></section><div id="dashboard" class="hide"><section><button id="logout">Esci</button><h2>Richieste di prenotazione</h2><label>Data <input type="date" id="day"></label><label>Impianto <select id="facility"><option value="">Tutti gli impianti</option><option value="a73d8263-04fb-4aa1-ad1f-1931169a82d9">Centro Sportivo SGM · Calcio a 5</option><option value="1e0e55d5-d37d-4084-be6c-c66b1fe60fb4">Aurelio Visalli</option></select></label><button id="reload">Aggiorna</button><p id="message"></p><div id="bookings"></div></section><section><h2>Blocca un orario</h2><p><small>Un blocco manuale impedisce nuove richieste per la stessa ora.</small></p><form id="blockForm"><label>Impianto <select id="blockFacility" required><option value="a73d8263-04fb-4aa1-ad1f-1931169a82d9">Centro Sportivo SGM</option><option value="1e0e55d5-d37d-4084-be6c-c66b1fe60fb4">Aurelio Visalli</option></select></label><label>Data <input id="blockDate" type="date" required></label><label>Ora <select id="blockHour"></select></label><label>Motivo <input id="reason" maxlength="150" placeholder="Es. allenamento"></label><button>Blocca orario</button></form><div id="blocks"></div></section><section><h2>Blocchi settimanali</h2><form id="recForm"><label>Impianto <select id="recFacility"><option value="a73d8263-04fb-4aa1-ad1f-1931169a82d9">Centro Sportivo SGM</option><option value="1e0e55d5-d37d-4084-be6c-c66b1fe60fb4">Aurelio Visalli</option></select></label><label>Giorno <select id="weekday"><option value="1">Lunedì</option><option value="2">Martedì</option><option value="3">Mercoledì</option><option value="4">Giovedì</option><option value="5">Venerdì</option><option value="6">Sabato</option><option value="0">Domenica</option></select></label><label>Inizio <select id="recStart"></select></label><label>Fine <select id="recEnd"></select></label><label>Motivo <input id="recReason" maxlength="150" placeholder="Es. allenamenti"></label><button>Crea blocco ricorrente</button></form><div id="recList"></div></section></div></main><script>const $=x=>document.getElementById(x),base='https://vgxatjdtawugxkzjkyxw.supabase.co',key='sb_publishable_4FuMVey4xj_B55InGcb1uw_pSMZ9Lk_';let token='',uid='';const today=()=>{let p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let g=k=>p.find(x=>x.type===k).value;return g('year')+'-'+g('month')+'-'+g('day')};$('day').value=today();$('blockDate').value=today();for(let h=8;h<=23;h++){let s=String(h).padStart(2,'0')+':00';for(let id of ['blockHour','recStart','recEnd']){if(id==='blockHour'&&h===23)continue;if(id==='recEnd'&&h===8)continue;let o=document.createElement('option');o.value=s;o.textContent=s;$(id).append(o)}}$('recEnd').value='09:00';async function req(path,method='GET',data){let r=await fetch(base+path,{method,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...(method==='PATCH'?{Prefer:'return=minimal'}:{})},...(data!==undefined?{body:JSON.stringify(data)}:{})});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.message||x.error_description||'Errore '+r.status)}return r.status===204?null:r.json().catch(()=>null)}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function auth(){let a=await req('/rest/v1/excondor_admins?select=user_id&user_id=eq.'+encodeURIComponent(uid));if(!a.length)throw Error('Account non autorizzato come amministratore SGM');$('login').classList.add('hide');$('dashboard').classList.remove('hide');await load()}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='Accesso in corso…';try{let r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Credenziali non valide');token=d.access_token;uid=d.user.id;$('password').value='';await auth();$('loginMsg').textContent=''}catch(e){token='';$('loginMsg').textContent=e.message}};$('logout').onclick=()=>{token='';uid='';$('dashboard').classList.add('hide');$('login').classList.remove('hide')};const fmt=t=>String(t).slice(0,5);async function load(){try{$('message').textContent='Caricamento…';let day=$('day').value,fac=$('facility').value;let filter='booking_date=eq.'+day+(fac?'&facility_id=eq.'+fac:'');let a=await req('/rest/v1/excondor_bookings?select=*&'+filter+'&order=start_time.asc');$('bookings').innerHTML=a.length?'':'Nessuna prenotazione per questa data.';for(let b of a){let d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(fmt(b.start_time))+'–'+esc(fmt(b.end_time))+'</b> · '+(b.facility_id==='a73d8263-04fb-4aa1-ad1f-1931169a82d9'?'Calcio a 5':'Aurelio Visalli · '+esc(b.sport||'Sport non specificato'))+'<p>'+esc(b.first_name)+' '+esc(b.last_name)+' · '+esc(b.phone)+'</p><p>Stato: <b>'+esc(b.status)+'</b></p><p class="muted">'+esc(b.notes||'')+'</p>';let ac=document.createElement('div');ac.className='actions';for(let [label,status] of [['Conferma','confirmed'],['Rifiuta','rejected']]){let btn=document.createElement('button');btn.textContent=label;btn.disabled=b.status===status;btn.onclick=async()=>{if(!confirm(label+' questa prenotazione?'))return;try{await req('/rest/v1/excondor_bookings?id=eq.'+encodeURIComponent(b.id),'PATCH',{status});await load()}catch(e){alert(e.message)}};ac.append(btn)}d.append(ac);$('bookings').append(d)}$('message').textContent=a.length+' prenotazioni';await loadBlocks()}catch(e){$('message').textContent=e.message}}async function loadBlocks(){let day=$('day').value;let b=await req('/rest/v1/excondor_blocked_slots?select=*&blocked_date=eq.'+day+'&order=start_time.asc');$('blocks').innerHTML='<h3>Blocchi del '+esc(day)+'</h3>';for(let x of b){let d=document.createElement('div');d.className='item';d.textContent=fmt(x.start_time)+' · '+(x.facility_id==='a73d8263-04fb-4aa1-ad1f-1931169a82d9'?'Centro Sportivo SGM':'Aurelio Visalli')+' · '+(x.reason||'');let bt=document.createElement('button');bt.textContent='Rimuovi';bt.onclick=async()=>{if(confirm('Rimuovere blocco?')){await req('/rest/v1/excondor_blocked_slots?id=eq.'+x.id,'DELETE');await loadBlocks()}};d.append(' ',bt);$('blocks').append(d)}let rs=await req('/rest/v1/excondor_recurring_blocks?select=*&active=eq.true&order=weekday.asc');$('recList').innerHTML='<h3>Blocchi settimanali attivi</h3>';for(let x of rs){let d=document.createElement('div');d.className='item';d.textContent=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][x.weekday]+' '+fmt(x.start_time)+'–'+fmt(x.end_time)+' · '+(x.facility_id==='a73d8263-04fb-4aa1-ad1f-1931169a82d9'?'Centro Sportivo SGM':'Aurelio Visalli')+' · '+(x.reason||'');let bt=document.createElement('button');bt.textContent='Disattiva';bt.onclick=async()=>{if(confirm('Disattivare blocco settimanale?')){await req('/rest/v1/excondor_recurring_blocks?id=eq.'+x.id,'PATCH',{active:false});await loadBlocks()}};d.append(' ',bt);$('recList').append(d)}}$('reload').onclick=load;$('day').onchange=load;$('facility').onchange=load;$('blockForm').onsubmit=async e=>{e.preventDefault();try{await req('/rest/v1/excondor_blocked_slots','POST',{facility_id:$('blockFacility').value,blocked_date:$('blockDate').value,start_time:$('blockHour').value,reason:$('reason').value||null});alert('Orario bloccato');await loadBlocks()}catch(e){alert(e.message)}};$('recForm').onsubmit=async e=>{e.preventDefault();if($('recStart').value>=$('recEnd').value)return alert('La fine deve essere dopo l’inizio');try{await req('/rest/v1/excondor_recurring_blocks','POST',{facility_id:$('recFacility').value,weekday:Number($('weekday').value),start_time:$('recStart').value,end_time:$('recEnd').value,reason:$('recReason').value||null,active:true});alert('Blocco settimanale creato');await loadBlocks()}catch(e){alert(e.message)}};</script></body></html>
