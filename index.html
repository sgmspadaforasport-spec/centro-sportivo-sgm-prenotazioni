<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro Sportivo SGM – Prenotazioni</title><style>body{background:#111;color:white;font:16px system-ui;margin:0}header{background:#f6d21a;color:#111;padding:24px;text-align:center}main{max-width:650px;margin:auto;padding:18px}section{background:#222;padding:20px;margin:16px 0;border-radius:12px}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;background:#333;color:white;border:1px solid #888;border-radius:7px}button,a.btn{background:#f6d21a;color:#111;border:0;padding:12px;border-radius:7px;font-weight:bold}button:disabled{opacity:.4}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slots button{background:#444;color:white}.slots button.sel{background:#f6d21a;color:#111}iframe{width:100%;height:240px;border:0}select[hidden]{display:none!important}</style><header><h1>CENTRO SPORTIVO SGM</h1>PRENOTAZIONI</header><main><section><h2>Impianto e calendario</h2><select id="facility"><option value="a73d8263-04fb-4aa1-ad1f-1931169a82d9">Centro Sportivo SGM – Calcio a 5</option><option value="1e0e55d5-d37d-4084-be6c-c66b1fe60fb4">Impianto Sportivo Aurelio Visalli</option></select><select id="sport" hidden><option value="">Seleziona disciplina</option><option>Pallavolo</option><option>Basket</option><option>Tennis</option></select><input id="date" type="date"><p>Slot di 60 minuti, dalle 08:00 alle 23:00. Pagamento al campo, conferma SGM obbligatoria.</p><div class="slots" id="slots"></div><p id="status"></p></section><section><h2>📍 Posizione</h2><a id="maps" class="btn" target="_blank" rel="noopener">Indicazioni Google Maps</a><p><iframe id="map" title="Mappa impianto" loading="lazy"></iframe></p></section><section><h2>Richiedi prenotazione</h2><form id="form"><input id="first" placeholder="Nome" required maxlength="80"><input id="last" placeholder="Cognome" required maxlength="80"><input id="phone" placeholder="Numero di telefono" required minlength="6" maxlength="30"><textarea id="notes" placeholder="Note facoltative" maxlength="1000"></textarea><button id="send" disabled>Invia richiesta</button><p id="result"></p></form><small>La richiesta non è confermata finché non viene approvata dalla SGM.</small></section></main><script>const $=x=>document.getElementById(x),api='https://vgxatjdtawugxkzjkyxw.supabase.co/rest/v1/rpc/',key='sb_publishable_4FuMVey4xj_B55InGcb1uw_pSMZ9Lk_',vis='1e0e55d5-d37d-4084-be6c-c66b1fe60fb4';let hour=null;const isVis=()=>$('facility').value===vis;async function rpc(n,data){let r=await fetch(api+n,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.message||'Errore');return j}function toggle(){$('send').disabled=hour===null||(isVis()&&!$('sport').value)}function map(){let q=isVis()?'Impianto Sportivo Aurelio Visalli Venetico Messina Italia':'Campo Ex Condor Venetico Messina Italia';$('maps').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);$('map').src='https://maps.google.com/maps?q='+encodeURIComponent(q)+'&output=embed'}async function refresh(){hour=null;toggle();$('slots').innerHTML='';$('status').textContent='Caricamento…';try{let a=await rpc('sgm_availability',{p_facility:$('facility').value,p_date:$('date').value});a.forEach(t=>{let b=document.createElement('button');b.type='button';b.textContent=t.slot_time;b.disabled=!t.available;b.onclick=()=>{hour=parseInt(t.slot_time);document.querySelectorAll('.slots button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');toggle()};$('slots').append(b)});$('status').textContent=a.some(x=>x.available)?'Seleziona un orario.':'Nessun orario disponibile.'}catch(e){$('status').textContent='Errore: '+e.message}}$('date').value=new Date().toLocaleDateString('en-CA');$('date').min=$('date').value;$('date').onchange=refresh;$('facility').onchange=()=>{$('sport').hidden=!isVis();$('sport').value='';map();refresh()};$('sport').onchange=toggle;$('form').onsubmit=async e=>{e.preventDefault();if(hour===null)return;$('send').disabled=true;try{const bookingId=await rpc(isVis()?'sgm_request_sport_booking':'sgm_request_booking',{p_facility:$('facility').value,p_date:$('date').value,p_hour:hour,p_first:$('first').value,p_last:$('last').value,p_phone:$('phone').value,p_notes:$('notes').value,...(isVis()?{p_sport:$('sport').value}:{})});fetch('https://vgxatjdtawugxkzjkyxw.supabase.co/functions/v1/sgm-telegram-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_id:bookingId})}).catch(()=>{});$('result').textContent='Richiesta ricevuta! Attendi conferma SGM.';$('form').reset();await refresh()}catch(e){$('result').textContent=e.message}finally{toggle()}};map();refresh();</script></html>
